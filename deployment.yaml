
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grunge-portfolio
  namespace: myapp
  labels:
    app: grunge-portfolio

spec:
  replicas: 2

  selector:
    matchLabels:
      app: grunge-portfolio

  template:
    metadata:
      labels:
        app: grunge-portfolio

    spec:
      containers:
        - name: grunge-portfolio
          image: yoheswari/grunge-portfolio:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 4321
              name: http

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
